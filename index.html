<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICAO Holding Entry Trainer</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #dfe3e8;
    --text: #1c2430;
    --muted: #637381;
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --success: #137333;
    --success-bg: #e6f4ea;
    --danger: #c5221f;
    --danger-bg: #fce8e6;
    --pill-bg: #f1f3f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 960px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 20px;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge-icao {
    background: #1c2430;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .title-group h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  .score-box {
    display: flex;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .score-pill {
    background: var(--pill-bg);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .readouts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .readout-card {
    background: var(--pill-bg);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .readout-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .readout-val {
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
  }
  .canvas-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  canvas {
    width: 100%;
    max-width: 480px;
    height: auto;
    display: block;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .box {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    background: #fff;
  }
  .box h2 {
    font-size: 14px;
    margin: 0 0 10px 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .quick-btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .quick-btn {
    padding: 7px 6px;
    border: 1px solid var(--border);
    background: var(--pill-bg);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c4cdd5;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 10px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
  }
  .btn-primary {
    width: 100%;
    padding: 10px 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    width: 100%;
    padding: 9px 14px;
    background: var(--pill-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-secondary:hover { background: #e5e8eb; }
  .feedback {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.45;
    display: none;
  }
  .feedback.correct {
    display: block;
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #ceead6;
  }
  .feedback.incorrect {
    display: block;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f6aea9;
  }
  .control-row {
    margin-bottom: 12px;
  }
  .control-row:last-child { margin-bottom: 0; }
  .control-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
  }
  input[type="range"] {
    width: 100%;
    cursor: pointer;
  }
  .turn-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .turn-btn {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--pill-bg);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .turn-btn.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-group">
      <span class="badge-icao">ICAO</span>
      <h1>Holding Pattern Entry Trainer</h1>
    </div>
    <div class="score-box">
      <div class="score-pill">Score: <span id="scoreText">0 / 0</span></div>
      <div class="score-pill">Streak: <span id="streakText">0</span></div>
    </div>
  </div>

  <div class="readouts">
    <div class="readout-card">
      <div class="readout-label">Aircraft Heading</div>
      <div class="readout-val" id="hdgReadout">HDG 242° UP</div>
    </div>
    <div class="readout-card">
      <div class="readout-label">Holding Radial Inbound</div>
      <div class="readout-val" id="radReadout">R-220° / INB 040°</div>
    </div>
    <div class="readout-card">
      <div class="readout-label">Turn Direction</div>
      <div class="readout-val" id="turnReadout">LEFT TURNS</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="canvas-wrap">
      <canvas id="compassCanvas" width="520" height="520"></canvas>
    </div>

    <div class="panel">
      <div class="box">
        <h2>1. Student Entry Quiz</h2>
        <div class="quick-btns">
          <button type="button" class="quick-btn" data-val="Direct">Direct</button>
          <button type="button" class="quick-btn" data-val="Teardrop">Teardrop</button>
          <button type="button" class="quick-btn" data-val="Parallel">Parallel</button>
        </div>
        <input type="text" id="answerInput" placeholder="Type Direct, Teardrop (Offset), or Parallel..." autocomplete="off">
        <button type="button" class="btn-primary" id="submitBtn">Check Answer &amp; Reveal Sectors</button>
        <button type="button" class="btn-secondary" id="randomBtn">New Random Scenario</button>
        <div id="feedbackBox" class="feedback"></div>
      </div>

      <div class="box">
        <h2>2. Scenario Parameters</h2>
        <div class="control-row">
          <div class="control-header">
            <label for="hdgSlider">Aircraft Heading</label>
            <span id="hdgCtrlVal">242°</span>
          </div>
          <input type="range" id="hdgSlider" min="0" max="359" value="242">
        </div>

        <div class="control-row">
          <div class="control-header">
            <label for="radSlider">Holding Radial Inbound</label>
            <span id="radCtrlVal">R-220° / INB 040°</span>
          </div>
          <input type="range" id="radSlider" min="0" max="359" value="220">
        </div>

        <div class="control-row">
          <div class="control-header">
            <span>Turn Direction</span>
          </div>
          <div class="turn-toggle">
            <button type="button" class="turn-btn active" id="btnLeft">Left Turns</button>
            <button type="button" class="turn-btn" id="btnRight">Right Turns</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const state = {
    heading: 242,
    radial: 220,
    turnDirection: 'Left',
    isRevealed: false,
    scoreCorrect: 0,
    scoreTotal: 0,
    streak: 0
  };

  const canvas = document.getElementById('compassCanvas');
  const ctx = canvas.getContext('2d');

  const hdgReadout = document.getElementById('hdgReadout');
  const radReadout = document.getElementById('radReadout');
  const turnReadout = document.getElementById('turnReadout');
  const hdgCtrlVal = document.getElementById('hdgCtrlVal');
  const radCtrlVal = document.getElementById('radCtrlVal');
  const hdgSlider = document.getElementById('hdgSlider');
  const radSlider = document.getElementById('radSlider');
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const answerInput = document.getElementById('answerInput');
  const submitBtn = document.getElementById('submitBtn');
  const randomBtn = document.getElementById('randomBtn');
  const feedbackBox = document.getElementById('feedbackBox');
  const scoreText = document.getElementById('scoreText');
  const streakText = document.getElementById('streakText');

  function pad3(deg) {
    const d = ((Math.round(deg) % 360) + 360) % 360;
    return String(d === 0 ? 360 : d).padStart(3, '0');
  }

  function norm360(deg) {
    return ((deg % 360) + 360) % 360;
  }

  function bearingToCanvasAngle(bearing) {
    return (bearing - state.heading - 90) * Math.PI / 180;
  }

  function getSectors() {
    const inb = norm360(state.radial + 180);
    if (state.turnDirection === 'Left') {
      const pStart = norm360(inb - 110);
      const pEnd = inb;
      const tStart = inb;
      const tEnd = norm360(inb + 70);
      const dStart = norm360(inb + 70);
      const dEnd = norm360(inb - 110);
      return [
        { name: 'Parallel', start: pStart, end: pEnd, span: 110, fill: 'rgba(217, 119, 6, 0.16)', stroke: '#b45309' },
        { name: 'Teardrop', start: tStart, end: tEnd, span: 70, fill: 'rgba(124, 58, 237, 0.16)', stroke: '#6d28d9' },
        { name: 'Direct', start: dStart, end: dEnd, span: 180, fill: 'rgba(22, 163, 74, 0.16)', stroke: '#15803d' }
      ];
    } else {
      const tStart = norm360(inb - 70);
      const tEnd = inb;
      const pStart = inb;
      const pEnd = norm360(inb + 110);
      const dStart = norm360(inb + 110);
      const dEnd = norm360(inb - 70);
      return [
        { name: 'Teardrop', start: tStart, end: tEnd, span: 70, fill: 'rgba(124, 58, 237, 0.16)', stroke: '#6d28d9' },
        { name: 'Parallel', start: pStart, end: pEnd, span: 110, fill: 'rgba(217, 119, 6, 0.16)', stroke: '#b45309' },
        { name: 'Direct', start: dStart, end: dEnd, span: 180, fill: 'rgba(22, 163, 74, 0.16)', stroke: '#15803d' }
      ];
    }
  }

  function isAngleInSector(angle, start, span) {
    const diff = norm360(angle - start);
    return diff <= span;
  }

  function getCorrectEntry() {
    const approachBearing = norm360(state.heading + 180);
    const sectors = getSectors();
    for (const s of sectors) {
      if (isAngleInSector(approachBearing, s.start, s.span)) {
        return { sector: s, approachBearing };
      }
    }
    return { sector: sectors[2], approachBearing };
  }

  function updateUI() {
    const inb = norm360(state.radial + 180);
    hdgReadout.textContent = `HDG ${pad3(state.heading)}° UP`;
    radReadout.textContent = `R-${pad3(state.radial)}° / INB ${pad3(inb)}°`;
    turnReadout.textContent = `${state.turnDirection.toUpperCase()} TURNS`;
    hdgCtrlVal.textContent = `${pad3(state.heading)}°`;
    radCtrlVal.textContent = `R-${pad3(state.radial)}° / INB ${pad3(inb)}°`;

    btnLeft.classList.toggle('active', state.turnDirection === 'Left');
    btnRight.classList.toggle('active', state.turnDirection === 'Right');

    scoreText.textContent = `${state.scoreCorrect} / ${state.scoreTotal}`;
    streakText.textContent = `${state.streak}`;
    draw();
  }

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const radius = 205;

    ctx.clearRect(0, 0, w, h);

    // Outer compass background
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#cbd5e1';
    ctx.stroke();

    // Draw entry sectors if revealed
    if (state.isRevealed) {
      const sectors = getSectors();
      const { sector: activeSector } = getCorrectEntry();

      sectors.forEach(sec => {
        const a1 = bearingToCanvasAngle(sec.start);
        const a2 = bearingToCanvasAngle(sec.end);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, a1, a2, false);
        ctx.closePath();
        ctx.fillStyle = sec.name === activeSector.name ? sec.fill.replace('0.16', '0.28') : sec.fill;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a1) * radius, cy + Math.sin(a1) * radius);
        ctx.strokeStyle = sec.stroke;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Label inside wedge
        const midBearing = norm360(sec.start + sec.span / 2);
        const midAngle = bearingToCanvasAngle(midBearing);
        const labelR = radius * 0.62;
        const lx = cx + Math.cos(midAngle) * labelR;
        const ly = cy + Math.sin(midAngle) * labelR;

        ctx.save();
        ctx.fillStyle = sec.stroke;
        ctx.font = sec.name === activeSector.name ? 'bold 13px sans-serif' : '600 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sec.name.toUpperCase(), lx, ly - 7);
        ctx.font = '11px sans-serif';
        ctx.fillText(`(${pad3(sec.start)}°–${pad3(sec.end)}°)`, lx, ly + 8);
        ctx.restore();
      });
    }

    // Compass ticks and labels
    for (let deg = 0; deg < 360; deg += 5) {
      const ang = bearingToCanvasAngle(deg);
      const isMajor = deg % 30 === 0;
      const isTen = deg % 10 === 0;
      const innerR = isMajor ? radius - 14 : isTen ? radius - 9 : radius - 5;

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR);
      ctx.lineTo(cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius);
      ctx.strokeStyle = isMajor ? '#334155' : '#94a3b8';
      ctx.lineWidth = isMajor ? 2 : 1;
      ctx.stroke();

      if (isMajor) {
        const textR = radius + 20;
        const tx = cx + Math.cos(ang) * textR;
        const ty = cy + Math.sin(ang) * textR;
        let label = String(deg / 10).padStart(2, '0');
        if (deg === 0) label = 'N';
        if (deg === 90) label = 'E';
        if (deg === 180) label = 'S';
        if (deg === 270) label = 'W';

        ctx.save();
        ctx.translate(tx, ty);
        ctx.font = ['N','E','S','W'].includes(label) ? 'bold 14px sans-serif' : '600 13px sans-serif';
        ctx.fillStyle = ['N','E','S','W'].includes(label) ? '#0f172a' : '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }
    }

    // Top lubber triangle (Aircraft Heading UP)
    ctx.beginPath();
    ctx.moveTo(cx, cy - radius - 2);
    ctx.lineTo(cx - 7, cy - radius - 13);
    ctx.lineTo(cx + 7, cy - radius - 13);
    ctx.closePath();
    ctx.fillStyle = '#1a73e8';
    ctx.fill();

    // Holding radial dashed extension to compass edge
    const radAng = bearingToCanvasAngle(state.radial);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(radAng) * radius, cy + Math.sin(radAng) * radius);
    ctx.strokeStyle = 'rgba(26, 115, 232, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Holding Racetrack in local frame
    const L = 105;
    const R = 22;
    const side = state.turnDirection === 'Left' ? 1 : -1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(radAng);

    // Fill racetrack
    ctx.beginPath();
    ctx.moveTo(L, 0);
    ctx.lineTo(0, 0);
    if (state.turnDirection === 'Left') {
      ctx.arc(0, R, R, -Math.PI / 2, Math.PI / 2, true);
      ctx.lineTo(L, 2 * R);
      ctx.arc(L, R, R, Math.PI / 2, -Math.PI / 2, true);
    } else {
      ctx.arc(0, -R, R, Math.PI / 2, -Math.PI / 2, false);
      ctx.lineTo(L, -2 * R);
      ctx.arc(L, -R, R, -Math.PI / 2, Math.PI / 2, false);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(26, 115, 232, 0.12)';
    ctx.fill();
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 2.6;
    ctx.stroke();

    // Arrowhead on inbound leg (pointing toward fix at 0,0)
    const inbMidX = L * 0.52;
    ctx.beginPath();
    ctx.moveTo(inbMidX - 8, 0);
    ctx.lineTo(inbMidX + 4, -5);
    ctx.lineTo(inbMidX + 4, 5);
    ctx.closePath();
    ctx.fillStyle = '#1a73e8';
    ctx.fill();

    // Arrowhead on outbound leg (pointing away toward +x)
    const outMidX = L * 0.48;
    const outY = side * 2 * R;
    ctx.beginPath();
    ctx.moveTo(outMidX + 8, outY);
    ctx.lineTo(outMidX - 4, outY - 5);
    ctx.lineTo(outMidX - 4, outY + 5);
    ctx.closePath();
    ctx.fillStyle = '#1a73e8';
    ctx.fill();

    ctx.restore();

    // Radial label pill near outer end of radial
    const pillDist = radius * 0.78;
    const px = cx + Math.cos(radAng) * pillDist;
    const py = cy + Math.sin(radAng) * pillDist;
    ctx.save();
    ctx.font = 'bold 11px sans-serif';
    const rText = `R-${pad3(state.radial)}°`;
    const tw = ctx.measureText(rText).width + 12;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.roundRect(px - tw / 2, py - 10, tw, 20, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rText, px, py);
    ctx.restore();

    // Dashed approach track from aircraft at bottom to VOR center
    const acY = cy + radius - 34;
    ctx.beginPath();
    ctx.moveTo(cx, acY - 12);
    ctx.lineTo(cx, cy + 12);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // VOR Fix symbol at center
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * 60) * Math.PI / 180;
      const vx = cx + Math.cos(a) * 11;
      const vy = cy + Math.sin(a) * 11;
      if (i === 0) ctx.moveTo(vx, vy);
      else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();

    // Aircraft icon at bottom pointing straight UP
    ctx.save();
    ctx.translate(cx, acY);
    ctx.fillStyle = '#1a73e8';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(3, -5);
    ctx.lineTo(15, 2);
    ctx.lineTo(15, 6);
    ctx.lineTo(3, 3);
    ctx.lineTo(3, 11);
    ctx.lineTo(8, 14);
    ctx.lineTo(8, 17);
    ctx.lineTo(0, 15);
    ctx.lineTo(-8, 17);
    ctx.lineTo(-8, 14);
    ctx.lineTo(-3, 11);
    ctx.lineTo(-3, 3);
    ctx.lineTo(-15, 6);
    ctx.lineTo(-15, 2);
    ctx.lineTo(-3, -5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function normalizeUserAnswer(raw) {
    const val = raw.trim().toLowerCase();
    if (!val) return null;
    if (val.startsWith('dir')) return 'Direct';
    if (val.startsWith('tea') || val.startsWith('off')) return 'Teardrop';
    if (val.startsWith('par')) return 'Parallel';
    return null;
  }

  function checkAnswer() {
    const parsed = normalizeUserAnswer(answerInput.value);
    if (!parsed) {
      feedbackBox.className = 'feedback incorrect';
      feedbackBox.textContent = 'Please enter Direct, Teardrop (or Offset), or Parallel.';
      return;
    }

    const { sector, approachBearing } = getCorrectEntry();
    const isCorrect = parsed === sector.name;

    if (!state.isRevealed) {
      state.scoreTotal += 1;
      if (isCorrect) {
        state.scoreCorrect += 1;
        state.streak += 1;
      } else {
        state.streak = 0;
      }
    }

    state.isRevealed = true;
    const inb = norm360(state.radial + 180);

    feedbackBox.className = isCorrect ? 'feedback correct' : 'feedback incorrect';
    feedbackBox.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> The entry is <strong>${sector.name}</strong>.<br>` +
      `Flying heading <strong>${pad3(state.heading)}°</strong> toward the VOR places you on the <strong>${pad3(approachBearing)}°</strong> approach bearing from the fix, ` +
      `inside the <strong>${pad3(sector.start)}°–${pad3(sector.end)}° ${sector.name}</strong> sector (${state.turnDirection} turns, INB ${pad3(inb)}°).`;

    updateUI();
  }

  function resetQuizState() {
    state.isRevealed = false;
    answerInput.value = '';
    feedbackBox.className = 'feedback';
    feedbackBox.textContent = '';
  }

  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      answerInput.value = btn.dataset.val;
      answerInput.focus();
    });
  });

  submitBtn.addEventListener('click', checkAnswer);
  answerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAnswer();
  });

  randomBtn.addEventListener('click', () => {
    state.heading = Math.floor(Math.random() * 360);
    state.radial = Math.floor(Math.random() * 360);
    state.turnDirection = Math.random() < 0.5 ? 'Left' : 'Right';
    hdgSlider.value = state.heading;
    radSlider.value = state.radial;
    resetQuizState();
    updateUI();
  });

  hdgSlider.addEventListener('input', e => {
    state.heading = Number(e.target.value);
    resetQuizState();
    updateUI();
  });

  radSlider.addEventListener('input', e => {
    state.radial = Number(e.target.value);
    resetQuizState();
    updateUI();
  });

  btnLeft.addEventListener('click', () => {
    state.turnDirection = 'Left';
    resetQuizState();
    updateUI();
  });

  btnRight.addEventListener('click', () => {
    state.turnDirection = 'Right';
    resetQuizState();
    updateUI();
  });

  updateUI();
})();
</script>
</body>
</html>
